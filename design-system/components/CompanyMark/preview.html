<!-- @dsCard group="Identity" height=260 subtitle="Logo on a light plate with one customer-value line" -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);padding:20px}#root{display:grid;gap:var(--space-4);max-width:420px}</style></head>
<body><div id="root"></div><script>
var D=window.VikDS,h=React.createElement;
var mark="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32"><rect width="32" height="32" rx="6" fill="#1b6ef3"/><text x="40" y="24" font-family="sans-serif" font-size="22" font-weight="700" fill="#111">Example</text></svg>');
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 h(D.CompanyMark,{name:'Example',description:'Placeholder logo that spells the name: no text repeat.',logo:mark,logoHasName:true}),
 h(D.CompanyMark,{name:'Icon only',description:'The name shows beside an icon-only mark.',logo:mark}),
 h(D.CompanyMark,{name:'Name only',description:'Shown while no logo file exists yet.'})));
</script></body></html>
