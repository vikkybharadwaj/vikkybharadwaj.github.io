name: Refresh "Git by the numbers"

# Computes the "Git by the numbers" strip from the private source repos and publishes
# it STRAIGHT TO main (GitHub Pages then redeploys). Runs entirely on GitHub — no Mac
# required. (This fully replaces the old local launchd agent, which has been retired.)
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Add a repository secret named HIGHLIGHTS_PAT — a *classic* Personal Access Token
# owned by @vikkybharadwaj with these scopes:
#   • repo       → clone the private source repos + push the refresh to main
#   • read:user  → read the contribution-calendar total (the "GitHub contributions"
#                  tile) via the GraphQL API
# Settings → Secrets and variables → Actions → New repository secret.
#
# ── Why a "once per Eastern day" gate, NOT an exact-hour gate ──────────────────
# GitHub's scheduled runners carry NO timing guarantee and routinely fire 1–2h late.
# The previous gate only proceeded when the Eastern hour was *exactly* 17, so a
# delayed run (e.g. landing at 19:xx ET) silently skipped — the strip went stale for
# days while every run still reported green. We now publish on the FIRST trigger of
# each Eastern day that finds the strip not-yet-refreshed-today; the day's later
# trigger(s) detect today's refresh commit and no-op. Robust to any GitHub delay.
#
# Note: this clones your private repos onto GitHub-hosted (ephemeral) runners. Only
# aggregate numbers are ever emitted to the public page — same as before.

on:
  schedule:
    # GitHub cron is UTC. We aim to land ~17:00 America/New_York: 21:00 UTC = 17:00
    # EDT (summer), 22:00 UTC = 17:00 EST (winter). Both fire every day; the gate
    # below dedupes so only the first to actually run each Eastern day publishes.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}        # manual "Run workflow" button (always publishes)

concurrency:
  group: highlights-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if already refreshed today (America/New_York)
        id: gate
        env:
          # Read-only commit lookup — the always-present default token is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — always publish."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/New_York date +%F)
          # Latest commit on main — one cheap API call, no clone yet.
          subject=$(gh api "repos/${{ github.repository }}/commits/main" \
                      --jq '.commit.message' | head -1)
          cdate=$(gh api "repos/${{ github.repository }}/commits/main" \
                    --jq '.commit.committer.date')
          cday=$(TZ=America/New_York date -d "$cdate" +%F)
          echo "Today (ET)=$today · last-commit day (ET)=$cday · subject: $subject"
          if [ "$cday" = "$today" ] && \
             printf '%s' "$subject" | grep -q 'chore(highlights): daily refresh'; then
            echo "Already refreshed today — nothing to do."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet refreshed today — proceeding."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone source repos, build, publish to main
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HIGHLIGHTS_PAT }}   # used by the `gh` CLI for the contributions query
          PAT: ${{ secrets.HIGHLIGHTS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::HIGHLIGHTS_PAT secret is not set — see the comment at the top of this workflow."
            exit 1
          fi
          OWNER=vikkybharadwaj
          base="https://x-access-token:${PAT}@github.com/${OWNER}"

          # Clone each private source repo to the exact path highlights.config.json expects
          # (paths use ~, which build-highlights.py expands against $HOME). Full history so
          # commit-since-2026 counts are correct. If a repo is named differently on GitHub
          # than its local folder, edit the repo name (right-hand side) here.
          mkdir -p "$HOME/github-repos"
          git clone --quiet "$base/tide.git"                      "$HOME/tide"
          git clone --quiet "$base/ai_knowledgecenter.git"        "$HOME/ai_knowledgecenter"
          git clone --quiet "$base/commandcenter.git"             "$HOME/github-repos/commandcenter"
          git clone --quiet "$base/claude-code-telegram-mcp.git"  "$HOME/github-repos/claude-code-telegram-mcp"
          git clone --quiet "$base/vikkybharadwaj.github.io.git"  "$HOME/github-repos/vikkybharadwaj.github.io"

          cd "$HOME/github-repos/vikkybharadwaj.github.io"
          git config user.name  "highlights-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 scripts/build-highlights.py

          if git diff --quiet; then
            echo "No change — numbers already current, nothing to publish."
            exit 0
          fi
          git --no-pager diff --stat
          git add -A
          git commit -m "chore(highlights): daily refresh of Git by the numbers"

          # Publish straight to main; rebase-retry if main advanced under us. Never force-pushes.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published refresh to main (attempt $attempt) — Pages will redeploy."
              exit 0
            fi
            echo "Push rejected — main advanced; rebasing onto latest origin/main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not publish to main after 3 attempts."
          exit 1
