name: Design conformance

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: design-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tokens.css is up to date with tokens.json
        run: |
          python3 scripts/build-design-tokens.py
          git diff --exit-code design-system/tokens.css
      - name: Pages conform to the design system
        run: python3 scripts/check-design-conformance.py -v
      - name: Gate tests and generated-HTML test
        run: python3 scripts/tests/run_tests.py
